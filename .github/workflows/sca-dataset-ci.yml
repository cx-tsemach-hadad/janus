name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto   # go.mod bumps from upgrades (e.g. x/crypto -> go 1.26) download the required toolchain
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'   # version used for the verified baseline (go.mod: go 1.15)
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
